<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shanning Marble</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            color: #333;
            background-color: #f9f9f9;
        }
        header {
            background-color: #222;
            color: #fff;
            padding: 15px 0;
            text-align: center;
        }
        nav {
            background-color: #444;
            text-align: center;
            padding: 10px 0;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 15px;
        }
        .banner {
            width: 100%;
            height: 400px;
            background-color: #eee;
            background-image: url('images/marble1.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-shadow: 0 0 5px rgba(0,0,0,0.7);
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .card {
            background-color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .card-content {
            padding: 15px;
        }
        footer {
            background-color: #222;
            color: #fff;
            text-align: center;
            padding: 20px 0;
            margin-top: 50px;
        }
    </style>
</head>
<body>

<header>
    <h1>Shanning Marble</h1>
</header>

<nav>
    <a href="index.html">首页</a>
    <a href="products.html">产品</a>
    <a href="contact.html">联系我们</a>
</nav>

<div class="banner">
    <h2>天然大理石 · 花岗岩大板</h2>
</div>

<div class="container">
    <h2>热门产品</h2>
    <div class="grid">
        <div class="card">
            <img src="images/marble2.jpg" alt="大理石">
            <div class="card-content">
                <h3>白大理石系列</h3>
                <p>高端工程首选，纹理自然清晰。</p>
            </div>
        </div>
        <div class="card">
            <img src="images/marble3.jpg" alt="花岗岩">
            <div class="card-content">
                <h3>花岗岩系列</h3>
                <p>硬度高、耐磨，适合户外与台面。</p>
            </div>
        </div>
        <div class="card">
            <img src="images/marble4.jpg" alt="定制加工">
            <div class="card-content">
                <h3>石材定制加工</h3>
                <p>楼梯、墙面、台面一站式服务。</p>
            </div>
        </div>
    </div>
</div>

<footer>
    <p>© 2026 Shanning Marble. All rights reserved.</p>
</footer>

</body>
</html>
